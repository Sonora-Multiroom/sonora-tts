name: Verify cache
on:
  pull_request:
    branches: [master]
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        id: c
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-09e0ecba6719bac0eff24f8dd74dc646790346f0c6991f60f5833d4fd5366b26
      - run: |
          echo "hit=${{ steps.c.outputs.cache-hit }}"
          ls ~/.m2/repository
          echo "--- ai:"; ls ~/.m2/repository/ai 2>&1 || true
          find ~/.m2/repository -path '*ai/multiroom*' | head
          echo "count=$(find ~/.m2/repository -path '*ai/multiroom*' | wc -l)"
